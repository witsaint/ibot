name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # oxlint + oxfmt run whole-repo from the root (not turbo tasks) and are fast.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Per-package graph tasks go through turbo (cached, dependency-ordered).
      - name: Types, test, build
        run: pnpm turbo run check-types test build
