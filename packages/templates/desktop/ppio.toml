# PPIO/AIProxy template config for the i-bot computer-use desktop.
#
# Human-readable record of the template's identity + spec. The actual build is
# driven by scripts/build-template.ts (ppio-sandbox library API), NOT a CLI that
# reads this file. Keep `template_name` / resources in sync with that script;
# `template_id` is pasted back here after the first successful build (also into
# src/manifest.ts → DESKTOP.templateId).
#
# team_id: leave blank to use the default team, or set to pin a team.

team_id = ""
dockerfile = "desktop.Dockerfile"
template_name = "ibot-desktop"
template_id = ""

# Chromium + Xvfb need a little headroom; the concrete spec is fixed by the
# template on the control-plane side (create-time cpuCount/memoryMB are ignored).
[resources]
cpu_count = 2
memory_mb = 4096
