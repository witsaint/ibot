; Boots the computer-use desktop. Ordering via priority: display first, then
; window manager, then the browser and remote-access bridges. Each stays up
; (autorestart) so a crashed Chrome or VNC recovers without losing the sandbox.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac +extension RANDR
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:openbox]
priority=20
command=/usr/bin/openbox
environment=DISPLAY=":0"
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:chrome]
priority=30
command=/usr/local/bin/start-chrome.sh
environment=DISPLAY=":0"
autorestart=true
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err

[program:x11vnc]
priority=40
command=/usr/bin/x11vnc -display :0 -forever -shared -rfbport 5900 -nopw -quiet
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
priority=50
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
